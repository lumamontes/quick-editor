[project]
name = "quick-editor"
version = "0.1.0"
description = "A local tool for turning photos and scans of drawings into clean, transparent vector SVGs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Luma Montes" }]
dependencies = [
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
  "scikit-image>=0.26",
  "pillow>=11.0",
  "pillow-heif>=0.18",
  "starlette>=0.40",
  "uvicorn>=0.30",
]

[project.scripts]
quick-editor = "quick_editor.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quick_editor"]
